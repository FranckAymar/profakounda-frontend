<div class="search-top">
    <div class="container">  
        <div class="row">

            <div class="col-md-6" >

                <div class="sf-type">
                    <div class="sf-input">
                        <mat-form-field >
                      
                            <div [formGroup]="myGroup">
                              <input type="text"   style="text-align: center;" id="sf-box"
                                  placeholder="Ville de résidence" formControlName="ville" [(ngModel)]="ville" aria-label="Number" matInput
                                  [formControl]="myControl2" [matAutocomplete]="auto2"  id="sf-box">
                            </div>     
                              <mat-autocomplete #auto2="matAutocomplete">
                                  <mat-option *ngFor="let option of filteredOptions2 | async"  [value]="option.designation">
                                      {{option.designation}}
                                  </mat-option>
                              </mat-autocomplete>
                          </mat-form-field>
                     </div>
                
                </div>

                <div class="sf-submit">
                    <input   
                            (click)="onFilterCoursCommun()"
                           type="submit" value="Rechercher">
                </div>  
                
            </div>      
           
            <div class="col-md-6">   
                <div class="search-form"> 
                        <div class="sf-type">
                            <div class="sf-input">
                                <input style="text-align: center;" type="number" [(ngModel)]="code"
                                        id="sf-box" placeholder="Rechercher un cours par son code d'identification">
                            </div>
                        
                        </div>
                </div>
                <div class="sf-submit">
                    <input   
                            (click)="onFilterCoursCommun()"
                           type="submit" value="Rechercher">
                </div>           
          </div>
          
        </div>
    </div>
   
</div>
