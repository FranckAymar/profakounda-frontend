<div class="search-top">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="search-form">
                    
                        <div class="sf-type">
                            <div class="sf-input">
                                <input type="text"  class="form-contol" [(ngModel)]="valeur" (ngModelChange)="OnFiltreFormation(valeur)" id="sf-box" placeholder="Search courses">
                            </div>

                        </div>
                        <div class="sf-submit">
                            <input type="submit"  value="Rechercher">
                        </div>
                     
                </div>
            </div>
        </div>
    </div>
</div>

<!-- POPULAR COURSES -->
   <section class="pop-cour">
    <div class="container com-sp pad-bot-70">
         <div class="row">
            <div class="con-title">
                <h2>Nos <span>Répétiteurs</span></h2>
            </div>
        </div> 

        <input type="text">
             {{valeur}} 

      
        <div class="row" *ngFor="let propositionFormation of propositionFormations">
            <a [routerLink]="['/formations/details-formation', propositionFormation.id]">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div class="home-top-cour">
                        <!--POPULAR COURSES IMAGE-->
                        <div class="col-md-2"> 
                             <p>
                                 <img height="100" src="{{urlServer}}/{{propositionFormation.idParticulier}}" alt="">
                            </p>
                        </div>
                        <!--POPULAR COURSES: CONTENT-->
                        <div class="col-md-10 home-top-cour-desc">
                            <a href="course-details.html">
                                <h3>{{propositionFormation.prenomParticulier}}</h3>
                            </a>
                            <h4 style="display: inline;" 
                            *ngFor="let moduleFomation of propositionFormation.moduleFormations; let i = index" [attr.data-index]="i">
                            {{moduleFomation.libelle}} <span *ngIf="propositionFormation.moduleFormations.length !== i+1">/</span>
                            </h4>
                            <p class="add-three-dot">{{propositionFormation.description}}</p>
                            <div class="hom-list-share">
                                <ul>
                                    <li><a [routerLink]="['/formations/details-formation', propositionFormation.id]"
                                        ><i class="fa fa-bar-chart" aria-hidden="true"></i> Details</a> </li>
                                </ul>
                            </div>
                        </div>
                    </div>
      
                </div>
                <div class="col-md-1"></div>

            </a>
        </div>
    </div>
</section>
