<!-- POPULAR COURSES -->
<section class="pop-cour">
    <div class="container com-sp pad-bot-70">
        <div class="row">
            <div class="con-title">
                <h2>Nos <span>Cours</span></h2>
            </div>
        </div>
        <div class="row" *ngFor="let propositionFormation of propositionFormations">
            <a [routerLink]="['/formations/details-formation', propositionFormation.id]">
                <div class="col-md-8">
                    <div style="border-radius: 0.3em;" class="home-top-cour">
                        <!--POPULAR COURSES IMAGE-->
                        <div class="col-md-3"> <img width="50" height="120"
                                src="{{urlServer}}/{{propositionFormation.idParticulier}}" alt=""> </div>
                        <!--POPULAR COURSES: CONTENT-->
                        <div class="col-md-9 home-top-cour-desc">
                            <a href="course-details.html">
                                <h3>{{propositionFormation.prenomParticulier}}</h3>
                            </a>
                            <h4><span
                                    *ngFor="let moduleFomation of propositionFormation.moduleFormations">{{moduleFomation.libelle}}</span>
                            </h4>
                            <p>{{propositionFormation.description}}</p>
                            <div class="hom-list-share">

                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        <div class="con-title">
            <a [routerLink]="['/formations']" >
                <p>Voir plus ...</p>
            </a>
        </div>
    </div>
</section>
