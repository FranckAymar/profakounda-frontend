<app-search-bar
    (getFormationsFiltrees)= "OnFiltreFormation($event)"
    (getFormationsFiltreParVille)= "OnFiterDeFormationParVille($event)"
></app-search-bar>
<section   class="pop-cour">
    <div class="container com-sp pad-bot-70">
        <div class="row">
            <div class="con-title">
                <h2>Les <span>Formateurs</span></h2>
            </div>
        </div>
        
        <div id="list-scroll"  class="col-md-8 list-scroll">
            <div *ngIf="propositionFormations.length == 0" style="width: 20em;margin: auto;">
                <span style="color: crimson;"  >Aucun resultat  correspondant.</span>
            </div>
            <div  class="row" *ngFor="let propositionFormation of propositionFormations">

                <div class="col-md-12">
                   <app-card-formation
                   [idParticulier]= "propositionFormation.idParticulier"
                    [code] = "propositionFormation.code"
                    [moduleFormations] = "propositionFormation.moduleFormations"
                    [etoilesEteints] = "propositionFormation.etoilesEteints"
                    [etoilesBrillants] = "propositionFormation.etoilesBrillants"
                    [contrats] = "propositionFormation.contrats"
                    [isAllModule] = "propositionFormation.isAllModule"
                    [cyclePrimairePresente] = "propositionFormation.cyclePrimairePresent"
                    [description] = "propositionFormation.description"
                    [ville] = "propositionFormation.ville"
                    [villeTemp] = "propositionFormation.ville"
                    [commune] = "$safeNavigationMigration(propositionFormation.commune?.libelle)" 
                    [id] = "propositionFormation.id"
                    [rayonIntervention] = "propositionFormation.rayonIntervention"
                    [isFavoris] = "propositionFormation.isFavoris"     
                    (coordMapEvent) = "viewCustomerInMap($event)"
                    ></app-card-formation>

                </div> 



            </div>
            <div  class="pg-pagina">
                <ul class="pagination">
                    <li [ngClass]="{'active': (i+1) === page }" (click)="onGetListFormation(i+1)"
                        *ngFor="let p of totalPageArray ; let i=index"><a>{{i+1}}</a></li>
                </ul>
            </div>

        </div>


        <div  class="col-md-4">
            <google-map *ngIf="propositionFormations" [center]="{lat: lat, lng: lng}" width="100%" height="700px" [zoom]="zoom">
                <map-marker 
                *ngFor="let pf of propositionFormations" [position]="{lat: $safeNavigationMigration(pf.rayonIntervention?.latitude), lng: $safeNavigationMigration(pf.rayonIntervention?.longitude)}"
                [label]="pf.code"> 
                </map-marker>

                <map-circle *ngFor="let pf of propositionFormations" [center]="{lat: $safeNavigationMigration(pf.rayonIntervention?.latitude), lng: $safeNavigationMigration(pf.rayonIntervention?.longitude)}"
                    [radius]="$safeNavigationMigration(pf.rayonIntervention?.rayon)" [options]="{draggable: true, editable: false, clickable: false}">
                </map-circle>
            </google-map>
        </div>

    </div>


</section>
