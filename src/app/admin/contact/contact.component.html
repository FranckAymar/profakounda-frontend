<div class="col-md-12">
    <div class="box-inn-sp">
        <div class="inn-title">
            <h4>Messages</h4>
        </div>
        <div class="tab-inn">
            <div class="table-responsive table-desi">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Telephone</th>
                            <th>Message</th>
                            <th>date de reception</th> 
                        </tr>

                    </thead>
                    <tbody>
                        <span *ngIf="contacts.length == 0">Aucun message reçu pour l'instant</span>
                        <tr *ngFor="let contact of contacts">
                            <td>{{contact.nom}}</td>
                            <td>{{contact.email}}</td>
                            <td>{{contact.telephone}}</td>
                            <td>{{contact.message}}</td>
                            <td>{{contact.dateCreation | date:'dd/MM/yyyy HH:mm'}}</td>
                            
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
