  <!--== User Details ==-->
  <div class="sb2-2-3">
    <div class="row">
        <div class="col-md-12">
        <div class="box-inn-sp admin-form">
                <div class="inn-title">
                    <img style="width: 10em;height: 10em;" src="../../assets/images/placeholder.jpg" alt="">
                    <div style="float: right;">
                        <h4 style="background-color: red;">Editer profil</h4>
                    </div>
                </div>

                <div class="tab-inn">

                    <form [formGroup] = "userForm" (ngSubmit)="onUpdateParticulier()">
                        <div class="row">
                            <div class="input-field col s6">
                                <input  id="first_name" type="text"  formControlName="nom" class="validate" />
                                <label for="first_name" class="">Nom</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="last_name" formControlName="prenoms" type="text" class="validate" />
                                <label for="last_name" class="">Prenoms</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s6">
                                <input id="phone" type="text" formControlName="telephone"  class="validate" />
                                <label for="phone">Téléphone</label>
                            </div>
                            <div class="input-field col s6">
                                <input type="email" id="email" formControlName="email" class="validate" />
                                <label for="email" class="">Email</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s6">
                                <input id="city" formControlName="lieuHabitation" type="text" class="validate">
                                <label for="city" class="">Lieu d'Habitation</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="country" formControlName="niveau" type="text" class="validate">
                                <label for="country" class="">Niveau d'etude</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s6">
                                <input id="password" formControlName="filiere" type="text" class="validate">
                                <label for="password" class="">Filiere</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="password1" formControlName="password" type="password" class="validate">
                                <label for="password1" class="">Mot de passe</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input type="file" (change)="onFileChange($event)" #fileInput class="validate">
                            </div>
                            
                        </div>
                        <button type="submit" [disabled]="userForm.invalid" class="btn btn-outline-info">Enregistrer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
