<!--== User Details ==-->
<div class="col-md-12">
    <div class="box-inn-sp">
        <div class="inn-title">
            <h4>Jours</h4>
        </div>
        <div class="tab-inn">
            <div class="table-responsive table-desi">
                <button type="button" (click)="initJour()" data-toggle="modal" data-target="#ajouterJour" class="btn btn-primary">
                    Ajouter
                </button>
                <!-- <button type="button" (click)="initJour()" data-toggle="modal" data-target="#autoComplete" class="btn btn-primary">
                    AutoComplete
                </button> -->
                <div style="margin-top: 2em;" *ngIf="error" class="alert alert-danger">
                    {{error}}
                </div>
                <div style="width: 100%;overflow: auto;">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Designation</th>     
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let j of jours">
                                <td>{{j.designation}}</td>
                                <td><button type="button" class="btn btn-primary" data-toggle="modal" data-target="#ajouterJour" (click)="upDateJour(j)"> Modifier</button></td>
                                <td><button type="button" class="btn btn-danger" (click)="supprimerJour(j.id)">Supprimer</button></td>
                            </tr>
    
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div>
     
      
    
</div>

<div class="modal fade" id="ajouterJour" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Enregistrer un jour</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <form  (ngSubmit)="onSaveJour()" #f="ngForm">
                <div class="form-group">
                    <label for="libelle" class="control-label">Désignation:</label>
                    <input type="text"  id="libelle" name="designation" [(ngModel)]="jour.designation" required class="form-control">
                </div>
                <button  type="submit" [disabled] = "f.invalid" class="btn btn-primary">Enregistrer</button>
            </form>
            
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  </div>
