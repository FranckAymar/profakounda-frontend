<!--== User Details ==-->
<div class="col-md-12">
    <div class="box-inn-sp">
        <div class="inn-title">
            <h4>Formations</h4>
        </div>
        <div class="tab-inn">
            <div class="table-responsive table-desi">
                <button type="button" (click)="initFormation()" data-toggle="modal" data-target="#ajouterFormation" class="btn btn-primary">
                    Ajouter
                </button>
                <div style="margin-top: 2em;" *ngIf="error" class="alert alert-danger">
                    {{error}}
                </div>
                <div style="width: 100%;overflow: auto;">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Designation</th>     
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let f of formations">
                                <td>{{f.libelle}}</td>
                                <td><button (click)="upDateFormation(f)" data-toggle="modal" data-target="#ajouterFormation" class="updateButton"><i class="fa fa-edit"></i></button></td>
                                <td><button (click)="supprimerFormation(f.id)" class="deleteButton"><i class="fa fa-times"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="ajouterFormation" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Enregistrer une formation</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <form  (ngSubmit)="onSaveFormation()" #f="ngForm">
                <div class="form-group">
                    <label for="libelle" class="control-label">Libéllé:</label>
                    <input type="text"  id="libelle" name="libelle" [(ngModel)]="formation.libelle" required class="form-control">
                </div>
                <button  type="submit" [disabled] = "f.invalid" class="btn btn-primary">Enregistrer</button>
            </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  </div>
