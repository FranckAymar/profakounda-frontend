<!--== User Details ==-->
<div class="col-md-12">
    <div class="box-inn-sp">
        <div class="inn-title">
            <h4>Niveaux</h4>
        </div>
        <div class="tab-inn">
            <div class="table-responsive table-desi">
                <button type="button" (click)="initialisation()" data-toggle="modal" data-target="#ajouterNiveau" class="btn btn-primary">
                    Ajouter
                </button>
                <div style="margin-top: 2em;" *ngIf="erreur" class="alert alert-danger">
                    {{erreur}}
                </div>
                <div style="width: 100%; overflow: auto;">
                  <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Libelle</th>
                            <th>Cycle</th>
                            <th>date de creation</th> 
                            <th>date de modification</th>            
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let niveau of niveaux">
                           
                            <td>{{niveau.libelle}}</td>
                            <td>{{niveau.cycle?.libelle}}</td>
                            <td>{{niveau.dateCreation|date:"yyyy-MM-dd HH:mm:ss"}}</td>
                            <td>{{niveau.dateModification|date:"yyyy-MM-dd HH:mm:ss"}}</td>
                            <td><button type="button" class="btn btn-primary" data-toggle="modal" data-target="#ajouterNiveau" (click)="onLoadClass(niveau)"> Modifier</button></td>
                            <td><button type="button" class="btn btn-danger" (click)="deleteNiveau(niveau.id)">Supprimer</button></td>
                        </tr>

                    </tbody>
                </table>
                </div>
            </div>
            <div class="pg-pagina">
              <ul class="pagination">
                  <li [ngClass]="{'active': (i+1) === page }" 
                  (click)= "onFetchNiveaux(i+1)" *ngFor="let p of totalPageArray ; let i=index"><a>{{i+1}}</a></li>
              </ul>
          </div>
        </div>
    </div>
</div>





  <div class="modal fade" id="ajouterNiveau" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div *ngIf="message" class="modal-header">
                    <span class="alert alert-info">{{message}}</span>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Libelle-->
                <form [formGroup]="classForm" (ngSubmit)="onSaveClasse()">
                    <div class="form-group">
                        <label for="libelle">Libelle:</label>
                        <input [(ngModel)]="classe.libelle" formControlName="libelle" type="text" id="libelle"
                            name="libelle" required>
                    </div>
                    <!-- Cycle-->
                    <div class="form-group">
                        <label for="cycle">Cycle :</label>
                        <select class="form-control" id="cycle" [(ngModel)]="classe.cycleId" formControlName="cycleId" required>
                            <option *ngFor="let cycle of cycles" [ngValue]="cycle.id">{{cycle.libelle}}</option>
                        </select>
                    </div>
                    <!-- Btn submit-->
                    <button [disabled]="classForm.invalid" type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>
