<!--== User Details ==-->
<div class="col-md-12">
    <div class="box-inn-sp">
        <div class="inn-title">
            <h4>Communes ou departements</h4>
        </div>
        <div class="tab-inn">
            <div class="table-responsive table-desi">
                <button type="button" (click)="initialisation()" data-toggle="modal" data-target="#ajouterCommune" class="btn btn-primary">
                    Ajouter
                </button>
                <div style="margin-top: 2em;" *ngIf="erreur" class="alert alert-danger">
                    {{erreur}}
                </div>
                <div style="width: 100%; overflow: auto;">
                  <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Libelle</th>
                            <th>Ville</th>
                                       
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let commune of communes">
                           
                            <td>{{commune.libelle}}</td>
                            <td>{{commune.ville?.designation}}</td>
                            
                            <td><button type="button" class="btn btn-primary" data-toggle="modal" data-target="#ajouterCommune" (click)="onLoadCommune(commune)"> Modifier</button></td>
                           
                        </tr>

                    </tbody>
                </table>
                </div>
            </div>
            
        </div>
    </div>
</div>





  <div class="modal fade" id="ajouterCommune" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
               
                <form [formGroup]="communeForm" (ngSubmit)="onSaveCommune()">
                    <div class="form-group">
                        <label for="libelle">Libelle:</label>
                        <input [(ngModel)]="commune.libelle" formControlName="libelle" type="text" id="libelle"
                            name="libelle" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="ville">Ville :</label>
                        <select class="form-control" id="ville" [(ngModel)]="commune.villeId" formControlName="villeId" required>
                            <option *ngFor="let ville of villes" [ngValue]="ville.id">{{ville.designation}}</option>
                        </select>
                    </div>
                   
                    <button [disabled]="communeForm.invalid" type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>
