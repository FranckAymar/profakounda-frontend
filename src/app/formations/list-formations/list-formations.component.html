<div class="search-top">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="search-form">
                    <div class="sf-type">
                        <div class="sf-input">
                            <input type="text" [(ngModel)]="criterRecherche" id="sf-box" placeholder="Search">
                        </div>

                    </div>
                    <div class="sf-submit">
                        <input type="submit" (click)="OnFiltreFormationSearch(criterRecherche)" value="Rechercher">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- POPULAR COURSES -->
<section class="pop-cour">
    <div class="container com-sp pad-bot-70">
        <div class="row">
            <div class="con-title">
                <h2>Nos <span>Répétiteurs</span></h2>
            </div>
        </div>

        <div class="col-md-8">

            <div class="row" *ngFor="let propositionFormation of propositionFormations">

                <div class="col-md-12">
                    <div class="home-top-cour">
                        <!--POPULAR COURSES IMAGE-->
                        <div class="col-md-2">
                            <p>
                                <img height="100" src="{{urlServer}}/{{propositionFormation.idParticulier}}" alt="">
                            </p>
                        </div>
                        <!--POPULAR COURSES: CONTENT-->
                        <div class="col-md-10 home-top-cour-desc">
                            <div>
                                <h3>{{propositionFormation.code}}</h3>
                            </div>
                            <h4 style="display: inline;"
                                *ngFor="let moduleFomation of propositionFormation.moduleFormations; let i = index"
                                [attr.data-index]="i">
                                {{moduleFomation.libelle}} <span
                                    *ngIf="propositionFormation.moduleFormations.length !== i+1">/</span>
                            </h4>
                            <p class="add-three-dot">{{propositionFormation.description}}</p><span
                                *ngIf="propositionFormation.ville"
                                class="home-top-cour-rat">{{propositionFormation.ville}}</span>
                            <div class="hom-list-share">
                                <ul>
                                    <li><a [routerLink]="['/formations/details-formation', propositionFormation.id]"><i
                                                class="fa fa-bar-chart" aria-hidden="true"></i> Details</a> </li>
                                    <li><a (click)="viewCustomerInMap(propositionFormation.rayonIntervention)"><i
                                                class="fa fa-map-marker" aria-hidden="true"></i>Sur la carte</a> </li>
                                    <li><a><i class="fa fa-heart fa-lg"
                                                [ngStyle]="{color: propositionFormation.isFavoris ? '#EC4067': '#DDDDD' }"
                                                aria-hidden="true"></i>Favoris</a> </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>



            </div>
            <div class="pg-pagina">
                <ul class="pagination">
                    <li [ngClass]="{'active': (i+1) === page }" (click)="onGetListFormation(i+1)"
                        *ngFor="let p of totalPageArray ; let i=index"><a>{{i+1}}</a></li>
                </ul>
            </div>

        </div>


        <div class="col-md-4">
            <agm-map *ngIf="propositionFormations" [latitude]="lat" [longitude]="lng" [zoom]="zoom">
                <agm-marker *ngFor="let pf of propositionFormations" [latitude]="pf.rayonIntervention?.latitude"
                    [longitude]="pf.rayonIntervention?.longitude">
                </agm-marker>

                <agm-circle *ngFor="let pf of propositionFormations" [latitude]="pf.rayonIntervention?.latitude"
                    [longitude]="pf.rayonIntervention?.longitude" [circleDraggable]="true" [editable]="false"
                    [radius]="pf.rayonIntervention?.rayon" [clickable]="false">
                </agm-circle>
            </agm-map>
        </div>

    </div>


</section>
